<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="公考刷题系统">
<meta name="theme-color" content="#143f5b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<title>公考刷题系统</title>
<style>
:root{
  --bg:#f0f2f5;
  --surface:#ffffff;
  --surface-2:#f5f7fa;
  --border:#eaecef;
  --ink:#111827;
  --ink-2:#374151;
  --muted:#9ca3af;
  --muted-2:#c4cad3;
  --primary:#1f3a4d;
  --primary-light:#e8f0f6;
  --primary-hover:#2a4a61;
  --green:#15803d;
  --green-soft:#dcfce7;
  --red:#b91c1c;
  --red-soft:#fee2e2;
  --gold:#b45309;
  --tab-h:56px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --shadow:0 2px 8px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 8px 24px rgba(0,0,0,.10);
  --r:12px;
  --r-sm:8px;
  --r-lg:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg);}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;
  font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg);
  padding-top:var(--safe-top);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ===== App shell ===== */
.app{display:flex;min-height:100vh;}

/* ===== Sidebar (iPad only) ===== */
.sidebar{display:none;flex-direction:column;width:220px;flex:none;background:var(--primary);color:#dbe3eb;
  padding:18px 0;transition:width .22s ease;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar.collapsed{width:60px;}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:0 18px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px;}
.sidebar .brand .logo{width:30px;height:30px;background:#e9d5a3;color:var(--primary);border-radius:6px;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;}
.sidebar .brand .name{font-size:15px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;}
.sidebar.collapsed .brand .name{display:none;}
.sidebar nav{display:flex;flex-direction:column;gap:2px;padding:0 8px;flex:1;}
.sidebar nav button{background:transparent;border:none;color:#bcc8d3;text-align:left;padding:10px 14px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:10px;transition:.15s;white-space:nowrap;}
.sidebar nav button:hover{background:rgba(255,255,255,.06);color:#fff;}
.sidebar nav button.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600;}
.sidebar nav button .ico{width:18px;text-align:center;font-size:15px;flex:none;}
.sidebar.collapsed nav button .lbl{display:none;}
.sidebar nav .sidebar-sync{
  min-height:56px;margin-top:10px;padding:9px 12px;
  color:#fff;background:linear-gradient(135deg,#2185b7,#176387);
  border:1px solid rgba(255,255,255,.2);box-shadow:0 8px 20px rgba(4,31,47,.22);
}
.sidebar nav .sidebar-sync:hover{background:linear-gradient(135deg,#2894c8,#1b7299);color:#fff;}
.sidebar-sync .sync-copy{display:flex;flex-direction:column;gap:2px;min-width:0;}
.sidebar-sync .sync-main{font-size:14px;font-weight:750;color:#fff;}
.sidebar-sync .sync-sub{font-size:10px;color:rgba(255,255,255,.72);overflow:hidden;text-overflow:ellipsis;}
.sidebar-sync .sync-spinner{display:none;}
.sidebar-sync.syncing .sync-cloud{display:none;}
.sidebar-sync.syncing .sync-spinner{display:block;animation:sync-spin .9s linear infinite;}
.sidebar.collapsed nav .sidebar-sync{justify-content:center;padding:9px 0;}
@keyframes sync-spin{to{transform:rotate(360deg);}}
.sidebar .foot{padding:10px 14px;color:rgba(255,255,255,.4);font-size:11px;letter-spacing:.06em;}
.sidebar.collapsed .foot{display:none;}
.sidebar-toggle{background:transparent;border:none;color:#bcc8d3;padding:8px 14px;cursor:pointer;font-size:18px;text-align:left;}
.sidebar-toggle:hover{color:#fff;}

/* ===== Main ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}
.wrap{max-width:600px;width:100%;margin:0 auto;
  padding:16px 16px calc(var(--tab-h) + var(--safe-bottom) + 20px);}

/* ===== Bottom tab bar ===== */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:blur(20px);
  backdrop-filter:blur(20px);
  border-top:1px solid rgba(0,0,0,.08);
  display:flex;align-items:stretch;
  height:calc(var(--tab-h) + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);
  z-index:20;
}
.tabbar .tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:none;border:none;padding:6px 4px 4px;gap:2px;
  color:var(--muted);transition:.13s;
}
.tabbar .tab .ico{font-size:22px;line-height:1;display:block;opacity:.45;transition:.13s;}
.tabbar .tab .lbl{font-size:10px;font-weight:500;letter-spacing:.02em;display:block;}
.tabbar .tab.on .ico{opacity:1;}
.tabbar .tab.on .lbl{color:var(--primary);font-weight:700;}
body.quiz-mode .tabbar{display:none;}

/* ===== Page headings ===== */
.page-head{padding:16px 0 10px;}
.page-head h1{font-size:26px;font-weight:800;letter-spacing:-.4px;color:var(--ink);}

.sec-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px;}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:48px 20px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);}

/* ===== Category cards ===== */
.cards{display:flex;flex-direction:column;gap:10px;}
.cat-card{
  background:var(--surface);border-radius:var(--r-lg);
  padding:16px;display:flex;align-items:center;gap:14px;
  cursor:pointer;box-shadow:var(--shadow);
  transition:transform .12s,box-shadow .12s;
}
.cat-card:active{transform:scale(.98);box-shadow:0 1px 3px rgba(0,0,0,.06);}
.cat-card .glyph{
  width:50px;height:50px;flex:none;background:var(--primary);color:#fff;
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:20px;letter-spacing:-.5px;
}
.cat-card .body{flex:1;min-width:0;}
.cat-card .name{font-weight:700;font-size:17px;color:var(--ink);margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cat-card .meta{font-size:13px;color:var(--muted);}
.cat-card .meta b{color:var(--ink-2);font-weight:600;}
.cat-card .chev{color:var(--muted-2);font-size:20px;font-weight:300;flex:none;}

/* ===== Paper cards ===== */
.paper-card{
  background:var(--surface);border-radius:var(--r);
  padding:16px;cursor:pointer;box-shadow:var(--shadow);
  transition:transform .12s,box-shadow .12s;
}
.paper-card:active{transform:scale(.98);box-shadow:0 1px 3px rgba(0,0,0,.06);}
.paper-card .p-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;}
.paper-card .p-title{font-weight:700;font-size:16px;color:var(--ink);flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.paper-card .p-count{font-size:12px;color:var(--muted);background:var(--bg);
  border-radius:6px;padding:3px 8px;white-space:nowrap;flex:none;}
.paper-card .menu-btn{background:transparent;border:none;color:var(--muted);
  font-size:20px;padding:0 4px;line-height:1;font-weight:700;letter-spacing:.5px;flex:none;}
.paper-card .p-stats{display:flex;gap:16px;align-items:center;}
.paper-card .p-stat{font-size:13px;color:var(--muted);}
.paper-card .p-stat b{color:var(--ink-2);font-weight:700;}
.paper-card .p-resume{
  margin-top:10px;padding:8px 12px;
  background:var(--primary-light);border-radius:8px;
  font-size:13px;color:var(--primary);font-weight:600;
  display:flex;align-items:center;gap:6px;
}
.paper-card .p-resume::before{content:'▶';font-size:9px;opacity:.7;}

/* ===== Menu sheet items ===== */
.menu-item{display:block;width:100%;text-align:left;background:transparent;border:none;
  padding:16px 4px;font-size:16px;color:var(--ink);cursor:pointer;
  border-bottom:1px solid var(--border);}
.menu-item:last-child{border-bottom:none;}
.menu-item:active{background:var(--surface-2);}
.menu-item.danger{color:var(--red);}
.menu-item .sub{display:block;font-size:12px;color:var(--muted);margin-top:3px;font-weight:400;}

/* ===== Breadcrumb ===== */
.crumb{display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:14px;}
.crumb button{background:none;border:none;color:var(--primary);font-size:14px;font-weight:600;padding:0;}
.crumb .cur{color:var(--ink);font-weight:700;}
.crumb .sep{color:var(--muted-2);}

/* ===== Quiz layout ===== */
body.quiz-mode .wrap{padding-bottom:calc(74px + var(--safe-bottom));}
.quiz-shell{display:flex;flex-direction:column;flex:1;}

.q-header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:10px 16px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:9;
}
.q-header .back{
  background:var(--bg);border:none;color:var(--ink);
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;
}
.q-header .info{flex:1;min-width:0;}
.q-header .info .t{font-weight:700;font-size:15px;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.q-header .info .m{font-size:12px;color:var(--muted);margin-top:1px;}
.q-header .timer{
  font-variant-numeric:tabular-nums;
  background:var(--bg);color:var(--ink-2);
  font-size:13px;font-weight:600;padding:6px 12px;
  border-radius:99px;white-space:nowrap;flex:none;
}

.qprog-track{height:3px;background:var(--border);overflow:hidden;}
.qprog-fill{height:100%;background:var(--primary);transition:width .3s;}

.q-pos{
  padding:12px 16px 4px;
  display:flex;justify-content:space-between;align-items:center;
}
.q-pos .num{font-size:13px;font-weight:600;color:var(--muted);}
.q-pos .done{font-size:13px;color:var(--muted);}

.q-body{padding:4px 16px 16px;}
.q-stem-card{
  background:var(--surface);border-radius:var(--r);
  padding:18px 16px;box-shadow:var(--shadow);margin-bottom:12px;
}
.q-stem-card .stem{font-size:16px;line-height:1.8;color:var(--ink);white-space:pre-wrap;}
.q-stem-card .q-figure{
  display:block;width:100%;height:auto;max-width:520px;margin:14px auto 0;
  border-radius:10px;background:#fff;object-fit:contain;
}

/* ===== Answer options ===== */
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{
  display:flex;gap:14px;align-items:flex-start;
  background:var(--surface);border:2px solid var(--border);
  border-radius:var(--r);padding:14px 16px;cursor:pointer;
  box-shadow:var(--shadow);transition:.12s;
}
.opt:active{transform:scale(.99);}
.opt .tag{
  font-weight:700;font-size:14px;
  width:28px;height:28px;flex:none;
  border:2px solid var(--border);color:var(--muted);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--bg);transition:.12s;
}
.opt .txt{flex:1;font-size:15px;line-height:1.65;color:var(--ink);padding-top:2px;}
.opt.sel{border-color:var(--primary);background:var(--primary-light);}
.opt.sel .tag{background:var(--primary);color:#fff;border-color:var(--primary);}
.opt.correct{border-color:var(--green);background:var(--green-soft);}
.opt.correct .tag{background:var(--green);color:#fff;border-color:var(--green);}
.opt.wrong{border-color:var(--red);background:var(--red-soft);}
.opt.wrong .tag{background:var(--red);color:#fff;border-color:var(--red);}
.graded .opt{cursor:default;}
.verdict{
  margin-top:12px;padding:12px 14px;border-radius:var(--r-sm);
  font-size:14px;font-weight:500;display:none;
}
.graded .verdict{display:block;}
.graded .verdict.ok{background:var(--green-soft);color:#14532d;}
.graded .verdict.no{background:var(--red-soft);color:#7f1d1d;}

/* ===== Quiz bottom bar ===== */
.qbar{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:blur(20px);
  backdrop-filter:blur(20px);
  border-top:1px solid rgba(0,0,0,.08);
  padding:8px 16px calc(8px + var(--safe-bottom));
  display:flex;gap:10px;align-items:center;z-index:18;
}
.qbar .icon-btn{
  background:var(--bg);border:none;color:var(--ink-2);
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;
}
.qbar .icon-btn.on{color:var(--gold);background:#fef3c7;}
.qbar .icon-btn.disabled{opacity:.35;pointer-events:none;}
.qbar .primary{
  flex:1;height:44px;background:var(--primary);color:#fff;
  border:none;border-radius:99px;font-size:15px;font-weight:700;
}
.qbar .primary:active{background:var(--primary-hover);}
.qbar .primary.submit{background:var(--green);}
.qbar .sub-btn{
  height:44px;background:transparent;border:2px solid var(--primary);
  color:var(--primary);border-radius:99px;font-size:13px;font-weight:700;
  padding:0 12px;flex:none;
}
.qbar .sub-btn:active{background:var(--primary-light);}
.qbar .sync-btn{
  height:44px;padding:0 13px;display:flex;align-items:center;justify-content:center;gap:6px;flex:none;
  background:#e8f4fa;color:#155d7e;border:1.5px solid #a9d4e7;border-radius:12px;
  font-size:13px;font-weight:750;white-space:nowrap;
}
.qbar .sync-btn:hover{background:#dceff8;border-color:#7fbed9;}
.qbar .sync-btn .ui-icon{width:18px;height:18px;}
.qbar .sync-btn .sync-spinner{display:none;animation:sync-spin .9s linear infinite;}
.qbar .sync-btn.syncing .sync-cloud{display:none;}
.qbar .sync-btn.syncing .sync-spinner{display:block;}
.qbar .sync-btn:disabled{opacity:.72;cursor:wait;}

/* ===== Bottom sheets ===== */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;}
.sheet-backdrop.show{display:block;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;
  background:var(--surface);border-radius:20px 20px 0 0;
  padding:12px 18px calc(20px + var(--safe-bottom));
  z-index:51;transform:translateY(100%);
  transition:transform .28s cubic-bezier(.32,.72,0,1);
  max-height:72vh;overflow-y:auto;
}
.sheet.show{transform:translateY(0);}
.sheet .grab{width:36px;height:4px;background:var(--muted-2);border-radius:99px;margin:0 auto 14px;}
.sheet .s-ttl{font-weight:700;font-size:16px;margin-bottom:6px;
  display:flex;justify-content:space-between;align-items:baseline;}
.sheet .legend{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.sheet .legend span{display:inline-flex;align-items:center;gap:4px;}
.sheet .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;border:1px solid var(--border);}
.sheet .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px;}
.acell{
  aspect-ratio:1;border:2px solid var(--border);background:var(--bg);
  color:var(--ink-2);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;cursor:pointer;
}
.acell.answered{border-color:var(--primary);color:var(--primary);}
.acell.correct{background:var(--green);border-color:var(--green);color:#fff;}
.acell.wrong{background:var(--red);border-color:var(--red);color:#fff;}
.acell.cur{box-shadow:0 0 0 3px rgba(31,58,77,.28);}
.sheet .acts{display:flex;gap:10px;margin-top:18px;}
.sheet .acts button{flex:1;}

/* ===== Buttons ===== */
.btn{font-size:14px;border:1.5px solid var(--border);background:var(--surface);
  color:var(--ink);padding:10px 18px;border-radius:99px;font-weight:600;}
.btn:active{background:var(--surface-2);}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.btn.primary:active{background:var(--primary-hover);}
.btn.danger{color:var(--red);border-color:transparent;background:var(--red-soft);}
.btn.sm{font-size:13px;padding:7px 14px;}

/* ===== Scorecard ===== */
.scorecard{
  background:var(--surface);border-radius:var(--r-lg);
  padding:32px 20px;text-align:center;box-shadow:var(--shadow-lg);margin-bottom:16px;
}
.scorecard .pct{font-size:64px;font-weight:800;color:var(--primary);line-height:1;letter-spacing:-2px;}
.scorecard .pct small{font-size:24px;color:var(--muted);font-weight:600;}
.scorecard .label{font-size:14px;color:var(--muted);margin-top:10px;}
.scorecard .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px;}

/* ===== Stats ===== */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 20px;}
.stat-cell{background:var(--surface);border-radius:var(--r);padding:14px 10px;
  text-align:center;box-shadow:var(--shadow);}
.stat-cell .v{font-weight:800;font-size:22px;color:var(--primary);line-height:1.1;}
.stat-cell .l{font-size:11px;color:var(--muted);margin-top:4px;font-weight:500;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px;}
.filter-row select{
  font-size:13px;border:1.5px solid var(--border);background:var(--surface);
  color:var(--ink);padding:8px 28px 8px 12px;border-radius:99px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
    linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) center,calc(100% - 10px) center;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}

/* history-wrap: outer clip+shadow, history-row slides inside */
.history-wrap{position:relative;overflow:hidden;border-radius:var(--r);box-shadow:var(--shadow);}
.history-row{background:var(--surface);padding:14px 15px;position:relative;z-index:1;
  /* transition applied via JS when finger lifts */}
.history-row .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px;}
.history-row .ttl{font-weight:700;font-size:15px;color:var(--ink);}
.history-row .ts{font-size:11px;color:var(--muted);}
.history-row .bot{display:flex;gap:14px;font-size:13px;color:var(--muted);align-items:center;}
.history-row .bot b{color:var(--ink-2);font-weight:700;}
.history-del{
  position:absolute;right:0;top:0;bottom:0;width:72px;
  background:var(--red);color:#fff;border:none;
  font-size:14px;font-weight:700;cursor:pointer;
}
.acc-hi{color:var(--green)!important;} .acc-mid{color:var(--gold)!important;} .acc-lo{color:var(--red)!important;}

.qitem{background:var(--surface);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow);cursor:pointer;}
.qitem:active{transform:scale(.99);}
.qitem .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;}
.qitem .src{font-size:12px;color:var(--muted);}
.qitem .stem{font-size:14px;color:var(--ink);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.qitem .bot{display:flex;gap:14px;margin-top:8px;font-size:13px;color:var(--muted);}
.qitem .bot .your{color:var(--red);font-weight:600;} .qitem .bot .ans{color:var(--green);font-weight:600;}
.qitem .actions{display:flex;gap:8px;margin-top:10px;}

/* ===== Right answer card (iPad) ===== */
.right-pane{display:none;flex:none;width:260px;border-left:1px solid var(--border);
  background:var(--surface);padding:16px;height:100vh;position:sticky;top:0;overflow-y:auto;}
.right-pane .ttl{font-weight:700;font-size:14px;margin-bottom:10px;}
.right-pane .legend{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.right-pane .legend i{width:10px;height:10px;border-radius:3px;border:1px solid var(--border);display:inline-block;margin-right:3px;vertical-align:middle;}
.right-pane .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.right-pane .acts{display:flex;flex-direction:column;gap:8px;margin-top:14px;}

/* ===== Data tab ===== */
.data-section p{color:var(--ink-2);font-size:14px;line-height:1.75;margin-bottom:14px;}

/* ===== Toast ===== */
.toast{
  position:fixed;left:50%;
  bottom:calc(var(--tab-h) + var(--safe-bottom) + 12px);
  transform:translateX(-50%);
  background:rgba(17,24,39,.9);color:#fff;
  padding:10px 20px;border-radius:99px;
  font-size:14px;font-weight:500;
  z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;
  max-width:80vw;text-align:center;white-space:nowrap;
}
.toast.show{opacity:1;}
body.quiz-mode .toast{bottom:calc(60px + var(--safe-bottom) + 12px);}

.hidden{display:none!important;}

/* ===== iPad / wide screen ===== */
@media (min-width: 880px){
  .sidebar{display:flex;}
  .tabbar{display:none;}
  .wrap{max-width:none;padding:18px 28px 90px;}
  body.quiz-mode .right-pane{display:block;}
  body.quiz-mode .wrap{max-width:760px;}
  body.quiz-mode .qbar{left:220px;right:260px;justify-content:center;padding-left:20px;padding-right:20px;}
  body.quiz-mode .sidebar.collapsed + .main .qbar{left:60px;}
  body.quiz-mode .qbar .primary{flex:0 1 220px;min-width:110px;max-width:220px;}
}
@media (max-width: 879px){
  .right-pane{display:none!important;}
  .sidebar{display:none!important;}
}

/* ===== 2026 mobile-first visual refresh ===== */
:root{
  --bg:#fbfcfe;
  --surface:#ffffff;
  --surface-2:#f4f7fa;
  --border:#dfe6ec;
  --ink:#111d2a;
  --ink-2:#334155;
  --muted:#667085;
  --muted-2:#8d99aa;
  --primary:#143f5b;
  --primary-light:#e8f1f6;
  --primary-hover:#0e344d;
  --green:#2f7d5b;
  --green-soft:#e6f3ec;
  --red:#c25555;
  --red-soft:#f9e9e9;
  --gold:#9b6b2f;
  --shadow:0 2px 10px rgba(20,63,91,.05);
  --shadow-lg:0 10px 28px rgba(20,63,91,.11),0 2px 7px rgba(17,29,42,.05);
  --r:15px;
  --r-lg:20px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Noto Sans SC",sans-serif;font-size:16px;line-height:1.55;letter-spacing:0;color:var(--ink);}
button,select{min-height:44px;}
.wrap{max-width:620px;padding:0 18px calc(var(--tab-h) + var(--safe-bottom) + 36px);}
.page-head{margin:0 -18px 22px;padding:26px 22px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;}
.page-head h1{font-size:32px;font-weight:760;letter-spacing:-1px;line-height:1.18;}
.page-head .head-action{width:42px;height:42px;border:0;border-radius:50%;background:transparent;color:var(--ink-2);display:flex;align-items:center;justify-content:center;}
.page-head .head-action:active{background:var(--primary-light);}
.ui-icon{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.ui-icon.sm{width:18px;height:18px;}

/* navigation */
.tabbar{height:calc(70px + var(--safe-bottom));padding:0 14px var(--safe-bottom);background:rgba(255,255,255,.97);border-color:var(--border);}
.tabbar .tab{padding:9px 4px 7px;gap:3px;color:var(--muted-2);}
.tabbar .tab .ico{height:25px;display:flex;align-items:center;justify-content:center;opacity:1;}
.tabbar .tab .ico .ui-icon{width:24px;height:24px;}
.tabbar .tab .lbl{font-size:12px;font-weight:500;letter-spacing:0;}
.tabbar .tab.on{color:var(--primary);}
.tabbar .tab.on .lbl{color:var(--primary);font-weight:700;}
.tabbar .tab.on .active-fill{fill:currentColor;stroke:currentColor;}
.sidebar{background:#1c3544;}
.sidebar .brand .logo{background:#fff;color:var(--primary);border-radius:9px;font-weight:700;}
.sidebar nav button .ico{height:20px;display:flex;align-items:center;justify-content:center;}
.sidebar nav button .ui-icon{width:19px;height:19px;}

/* shared grouped surfaces */
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 2px 13px;}
.section-head h2{font-size:20px;font-weight:730;letter-spacing:-.35px;}
.section-head button{border:0;background:transparent;color:var(--muted);font-size:15px;padding:0 2px;min-height:36px;}
.group-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.group-row{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border);cursor:pointer;min-height:78px;}
.group-row:last-child{border-bottom:0;}
.group-row:active{background:var(--surface-2);}
.group-row .row-body{flex:1;min-width:0;}
.group-row .row-title{font-size:17px;font-weight:680;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.group-row .row-meta{font-size:14px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.group-row .row-chev{color:var(--muted-2);font-size:22px;line-height:1;}
.empty{box-shadow:none;border:1px solid var(--border);color:var(--muted);padding:44px 20px;}
.sec-label{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;text-transform:none;margin:24px 2px 10px;}

/* redesigned home */
.home-hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px 21px 21px;box-shadow:var(--shadow-lg);}
.home-hero .hero-top{display:block;}
.home-hero .eyebrow{font-size:16px;color:var(--muted);margin-bottom:6px;}
.home-hero .hero-title{font-size:27px;font-weight:740;letter-spacing:-.65px;line-height:1.25;}
.hero-status-line{margin-top:10px;}
.home-hero .status{display:inline-flex;font-size:14px;font-weight:700;color:var(--primary);background:var(--primary-light);padding:5px 11px;border-radius:8px;white-space:nowrap;}
.hero-progress-line{display:flex;align-items:center;gap:14px;margin:22px 0 13px;}
.hero-progress{height:8px;flex:1;background:#e5edf2;border-radius:99px;overflow:hidden;}
.hero-progress span{display:block;height:100%;background:var(--primary);border-radius:inherit;}
.hero-progress-value{width:42px;text-align:right;color:var(--muted);font-size:15px;}
.hero-meta{display:flex;justify-content:flex-start;align-items:center;gap:18px;font-size:15px;color:var(--muted);margin-bottom:20px;}
.hero-meta .sep{width:1px;height:20px;background:var(--border);}
.hero-btn{width:100%;height:54px;border:0;border-radius:12px;background:linear-gradient(135deg,#174c70,#113b58);color:#fff;font-size:17px;font-weight:720;box-shadow:0 5px 14px rgba(20,63,91,.16);}
.hero-btn:active{background:var(--primary-hover);transform:scale(.99);}
.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.category-grid.one{grid-template-columns:repeat(2,minmax(0,1fr));}
.category-item{min-height:94px;border:0;background:var(--surface);padding:16px 17px;display:flex;align-items:center;gap:13px;text-align:left;border-right:1px solid var(--border);border-bottom:1px solid var(--border);}
.category-item:nth-child(2n){border-right:0;}
.category-item:nth-last-child(-n+2){border-bottom:0;}
.category-grid.one .category-item{border-right:1px solid var(--border);border-bottom:1px solid var(--border);}
.category-item:active{background:var(--surface-2);}
.category-item .cat-icon{width:42px;height:42px;border-radius:0;background:transparent;color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none;}
.category-item .cat-icon .ui-icon{width:32px;height:32px;stroke-width:1.6;}
.category-item .cat-name{font-size:17px;font-weight:650;color:var(--ink);}
.category-item .cat-meta{font-size:12px;color:var(--muted);margin-top:3px;}
.category-item .cat-name,.category-item .cat-meta{display:block;}

/* paper list */
.crumb{margin:0 0 12px;}
.crumb button{font-weight:600;min-height:40px;display:flex;align-items:center;gap:3px;}
.crumb .sep,.crumb .cur{display:none;}
.paper-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.paper-card{border-radius:0;padding:15px 16px;box-shadow:none;border-bottom:1px solid var(--border);}
.paper-card:last-child{border-bottom:0;}
.paper-card:active{transform:none;background:var(--surface-2);box-shadow:none;}
.paper-card .p-top{margin-bottom:4px;}
.paper-card .p-title{font-size:16px;font-weight:650;}
.paper-card .p-count{background:transparent;color:var(--muted);padding:0;font-size:13px;}
.paper-card .menu-btn{width:38px;height:38px;min-height:38px;border-radius:50%;font-weight:600;}
.paper-card .menu-btn:active{background:var(--primary-light);}
.paper-card .p-stats{gap:10px;}
.paper-card .p-stat{font-size:13px;color:var(--muted);}
.paper-card .p-stat b{color:var(--muted);font-weight:500;}
.paper-card .p-resume{margin-top:10px;padding:8px 10px;border-radius:8px;font-size:13px;}

/* review pages */
.review-tabs{display:grid;grid-template-columns:1fr 1fr;background:#e9edf0;border-radius:10px;padding:3px;margin-bottom:14px;}
.review-tabs button{border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:14px;font-weight:600;}
.review-tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(23,33,43,.09);}
.filter-row{margin:0 0 14px;gap:8px;}
.filter-row select{border:1px solid var(--border);border-radius:10px;background-color:var(--surface);color:var(--ink-2);padding:9px 30px 9px 12px;}
.qitem{border-radius:0;box-shadow:none;border-bottom:1px solid var(--border);padding:15px 16px;}
.qitem:last-child{border-bottom:0;}
.cards{gap:10px;}
.cards .qitem:first-child{border-radius:var(--r) var(--r) 0 0;}
.cards .qitem:last-child{border-radius:0 0 var(--r) var(--r);}

/* records */
.stat-grid{grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 22px;}
.stat-cell{box-shadow:none;border:1px solid var(--border);padding:16px 8px;}
.stat-cell .v{font-size:22px;font-weight:700;color:var(--primary);}
.stat-cell .l{font-size:12px;color:var(--muted);}
.history-wrap{box-shadow:none;border-radius:0;border-bottom:1px solid var(--border);}
.history-wrap:first-child{border-radius:var(--r) var(--r) 0 0;}
.history-wrap:last-child{border-radius:0 0 var(--r) var(--r);border-bottom:0;}
.history-row{padding:15px 16px;}
.history-row .ttl{font-weight:650;}
#historyList{gap:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}

/* profile/data */
.profile-banner{background:var(--primary-light);color:var(--primary);border-radius:var(--r);padding:16px;margin-bottom:22px;}
.profile-banner strong{display:block;font-size:16px;margin-bottom:4px;}
.profile-banner span{font-size:13px;color:var(--muted);}
.settings-group{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:18px;}
.setting-row{width:100%;min-height:64px;border:0;border-bottom:1px solid var(--border);background:transparent;padding:12px 16px;display:flex;align-items:center;gap:12px;text-align:left;}
.setting-row:last-child{border-bottom:0;}
.setting-row:active{background:var(--surface-2);}
.setting-row .setting-icon{width:34px;height:34px;border-radius:9px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none;}
.setting-row .setting-body{flex:1;}
.setting-row .setting-title{font-size:15px;font-weight:600;}
.setting-row .setting-meta{font-size:12px;color:var(--muted);margin-top:2px;}
.setting-row.danger{color:var(--red);}
.setting-row.danger .setting-icon{background:var(--red-soft);color:var(--red);}
.data-section>p,.data-section>div[style],.data-section>.sec-label{display:none;}

/* result */
.score-mode .q-pos{display:none;}
.score-mode .qbar{display:none!important;}
.score-mode{background:linear-gradient(180deg,#eaf1ff 0,#f4f6fa 250px,#f4f6fa 100%);}
.score-mode .qprog-track,.score-mode .q-header .timer{display:none;}
.score-mode .q-body{padding-top:16px;}
.report-page{display:flex;flex-direction:column;gap:14px;padding-bottom:18px;}
.report-card{background:rgba(255,255,255,.96);border:1px solid rgba(219,227,237,.95);border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(50,72,105,.08);}
.report-summary{position:relative;text-align:center;padding-top:22px;}
.report-score-pill{position:absolute;right:16px;top:14px;background:#165bd8;color:#fff;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;box-shadow:0 4px 12px rgba(22,91,216,.22);}
.report-ring{--score:0deg;width:164px;height:164px;margin:2px auto 18px;border-radius:50%;background:conic-gradient(#2466e8 0 var(--score),#dfe6f8 var(--score) 360deg);position:relative;display:grid;place-items:center;}
.report-ring::before{content:"";position:absolute;inset:15px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px rgba(226,232,240,.8);}
.report-ring-core{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;line-height:1;}
.report-ring-core span{font-size:14px;color:var(--muted);margin-bottom:7px;}
.report-ring-core b{font-size:50px;letter-spacing:-2px;color:var(--ink);}
.report-ring-core em{font-size:15px;font-style:normal;color:var(--muted);margin-top:5px;}
.report-delta{display:inline-flex;margin:-6px auto 14px;padding:5px 10px;border-radius:99px;background:var(--primary-light);color:var(--primary);font-size:12px;font-weight:650;}
.report-meta{border-top:1px solid var(--border);padding-top:13px;display:grid;gap:8px;text-align:left;}
.report-meta-row{display:flex;justify-content:space-between;gap:14px;font-size:13px;color:var(--muted);}
.report-meta-row strong{color:var(--ink-2);font-weight:600;text-align:right;}
.report-card-title{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:730;margin-bottom:15px;}
.report-title-icon{width:28px;height:28px;border-radius:8px;background:#e7f0ff;color:#165bd8;display:grid;place-items:center;flex:none;}
.report-title-icon .ui-icon{width:17px;height:17px;}
.report-metrics{display:grid;grid-template-columns:repeat(5,1fr);background:#f2f5fa;border-radius:12px;padding:13px 4px;margin-bottom:16px;}
.report-metrics.practice{grid-template-columns:repeat(4,1fr);}
.report-metric{text-align:center;border-right:1px solid #dfe5ee;min-width:0;}
.report-metric:last-child{border-right:0;}
.report-metric span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;}
.report-metric b{display:block;font-size:18px;margin-top:3px;color:var(--ink);white-space:nowrap;}
.report-metric.correct b{color:var(--green);}.report-metric.wrong b{color:var(--red);}.report-metric.time b{color:#165bd8;font-size:15px;padding-top:3px;}
.report-category{display:flex;align-items:flex-start;gap:10px;}
.report-category .dot{width:24px;height:24px;border-radius:50%;background:#165bd8;color:#fff;display:grid;place-items:center;flex:none;margin-top:1px;}
.report-category strong{display:block;font-size:16px;margin-bottom:3px;}
.report-category p{font-size:13px;color:var(--muted);line-height:1.55;}
.report-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
.report-card-head .report-card-title{margin:0;}
.report-legend{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--muted);}
.report-legend span{display:inline-flex;align-items:center;gap:4px;}.report-legend i{width:8px;height:8px;border-radius:50%;display:block;}
.report-answer-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:13px 10px;}
.report-answer-grid button{width:42px;height:42px;min-height:42px;border:0;border-radius:50%;justify-self:center;font-size:14px;font-weight:650;background:#eef1f5;color:var(--muted);}
.report-answer-grid button.correct{background:#13a675;color:#fff;}.report-answer-grid button.wrong{background:#e64949;color:#fff;}.report-answer-grid button.unanswered{background:#edf0f4;color:#8a95a5;}
.report-answer-grid button.answered{background:var(--primary);color:#fff;}
.report-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px;}
.report-actions .btn{width:100%;min-height:50px;border-radius:14px;}
.report-actions .primary{background:#165bd8;border-color:#165bd8;color:#fff;}
.report-actions .wide{grid-column:1/-1;}
.report-actions .ghost{border-color:transparent;background:transparent;color:var(--muted);}

/* richer history rows; swipe-to-delete remains available */
.history-row{display:flex;align-items:center;gap:13px;padding:15px 16px;cursor:pointer;}
.history-score{width:52px;height:52px;border-radius:14px;background:var(--primary-light);color:var(--primary);display:grid;place-items:center;font-size:17px;font-weight:750;flex:none;}
.history-score.acc-hi{background:var(--green-soft);}.history-score.acc-mid{background:#fff5df;}.history-score.acc-lo{background:var(--red-soft);}
.history-score.practice{background:var(--primary-light);color:var(--primary);}
.history-main{flex:1;min-width:0;}.history-main .top{margin:0 0 4px;align-items:center;}.history-main .bot{gap:10px;font-size:12px;flex-wrap:wrap;}
.history-main .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.history-main .ts{flex:none;}
.history-view{color:var(--muted-2);font-size:22px;flex:none;}

/* keep quiz interactions, align visuals */
.q-header{padding:10px 16px;background:rgba(255,255,255,.97);}
.q-header .back{background:transparent;color:var(--ink);}
.q-header .info .t{font-weight:650;}
.q-header .info .m{color:var(--muted);}
.q-header .timer{background:var(--primary-light);color:var(--primary);}
.q-pos .num,.q-pos .done{color:var(--muted);}
.q-stem-card{box-shadow:none;border:1px solid var(--border);}
.opt{box-shadow:none;border:1.5px solid var(--border);}
.opt .tag{border:0;background:var(--surface-2);color:var(--muted);}
.qbar{gap:8px;border-color:var(--border);}
.qbar .icon-btn{background:var(--surface-2);color:var(--ink-2);}
.qbar .answer-card-btn .ui-icon{width:20px;height:20px;stroke-width:1.7;}
.qbar .primary,.qbar .sub-btn{border-radius:12px;}
.qbar .sub-btn{border-width:1.5px;}

@media (max-width:879px){
  body.quiz-mode .wrap{padding:0 0 calc(74px + var(--safe-bottom));max-width:none;}
  body.quiz-mode #page-quiz{width:100%;}
  body.quiz-mode .q-header{padding-left:18px;padding-right:18px;}
  body.quiz-mode .q-pos{padding-left:20px;padding-right:20px;}
  body.quiz-mode .q-body{padding-left:18px;padding-right:18px;}
  .qbar{gap:6px;padding-left:8px;padding-right:8px;}
  .qbar .icon-btn{width:40px;height:40px;}
  .qbar .sync-btn{width:40px;height:40px;padding:0;}
  .qbar .sync-btn .sync-label{display:none;}
  .qbar .primary{min-width:0;height:40px;}
  .qbar .sub-btn{height:40px;padding:0 9px;}
}

@media (min-width:880px){
  .wrap{padding:22px 32px 90px;}
  .page-head{padding-top:12px;}
  .category-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .home-dashboard{max-width:760px;margin:0 auto;}
}
@media (min-width:880px) and (max-width:1099px){
  body.quiz-mode .qbar{gap:6px;padding-left:8px;padding-right:8px;}
  body.quiz-mode .qbar .icon-btn{width:38px;height:38px;}
  body.quiz-mode .qbar .sync-btn{width:38px;height:38px;padding:0;}
  body.quiz-mode .qbar .sync-btn .sync-label{display:none;}
  body.quiz-mode .qbar .primary{height:38px;min-width:80px;max-width:160px;}
  body.quiz-mode .qbar .sub-btn{height:38px;padding:0 8px;}
}
</style>

      <button data-tab="data" onclick="go('data')"><span class="ico"><svg class="ui-icon"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></span><span class="lbl">我的</span></button>

<script src="sync.js"></script>
<script>
'use strict';

// =========== Constants & State ===========
const STORE_HISTORY   = 'sihai_quiz_history_v1';
const STORE_FAVS      = 'sihai_quiz_favs_v1';
const STORE_SIDEBAR   = 'sihai_quiz_sidebar_collapsed_v1';
const STORE_OVERRIDES = 'sihai_quiz_overrides_v1';  // per-paper user edits (category)
const STORE_SESSIONS  = 'sihai_quiz_sessions_v1';   // in-progress sessions

const state = {
  papers: [],
  paperData: {},
  // home drill
  homeView: 'categories',
  activeCategory: null,
  // quiz
  current: null,
  currentQ: 0,
  selected: {},
  graded: false,
  startedAt: 0,
  timerId: 0,
  reportReturn: null,
  reportRecord: null,
};

// =========== Helpers ===========
const $ = (id)=>document.getElementById(id);
function toast(msg, dur=1600){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), dur);
}
function uuid(){return 'h-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);}
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(ts){
  const d=new Date(ts), p=(n)=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDuration(sec){
  if (sec<60) return sec+'秒';
  const m=Math.floor(sec/60), s=sec%60;
  if (m<60) return `${m}分${s?`${s}秒`:''}`;
  return `${Math.floor(m/60)}小时${m%60?`${m%60}分`:''}`;
}
function mmss(sec){
  const m=Math.floor(sec/60), s=sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function isGradablePaper(data){
  if (!data || data.grading === 'none') return false;
  return Array.isArray(data.questions) && data.questions.length > 0 &&
    data.questions.every(q=>String(q.answer || '').trim());
}
function isPracticeRecord(record){
  return !!record && (record.grading === 'none' || record.accuracy == null);
}
const HOME_CATEGORY_DEFS = [
  {name:'判断推理', test:/判断|定义|逻辑|图形|类比|推理/},
  {name:'言语理解', test:/言语|阅读|语文|词语|片段/},
  {name:'资料分析', test:/资料|数据|分析/},
  {name:'课程试卷', test:/课程|套题|模拟|试卷/},
];
function homeCategoryFor(raw){
  const cat = String(raw || '').trim();
  const found = HOME_CATEGORY_DEFS.find(x=>x.test.test(cat));
  return found ? found.name : (cat || '其他题库');
}
function categoryIcon(cat){
  const c = cat || '';
  if (/判断|定义|逻辑|图形|类比|推理/.test(c)) return '<svg class="ui-icon"><path d="M9 20v-3.2l-3-2.4V9.5a6 6 0 1 1 10.8 3.6L15 15v5"/><circle cx="12" cy="9" r="2.2"/><path d="M5.8 10H3.5"/></svg>';
  if (/言语|阅读|语文|词语|片段/.test(c)) return '<svg class="ui-icon"><path d="M6 2.5h8l4 4V21H6z"/><path d="M14 2.5V7h4M9 11h6m-6 4h6"/></svg>';
  if (/资料|数据|分析/.test(c)) return '<svg class="ui-icon"><path d="M4 20V13h4v7m3 0V8h4v12m3 0V4h3v16"/><path d="M2 20h20"/></svg>';
  if (/课程|套题|模拟|试卷/.test(c)) return '<svg class="ui-icon"><path d="M5 3h11l3 3v15H5z"/><path d="M16 3v4h3M9 11h6m-6 4h6"/><path d="M16 21l-2-2-2 2"/></svg>';
  return '<svg class="ui-icon"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H20v17H7.5A3.5 3.5 0 0 0 4 22z"/><path d="M4 5.5V22M8 6h8m-8 4h7"/></svg>';
}
function loadHistory(){try{return JSON.parse(localStorage.getItem(STORE_HISTORY)||'[]');}catch{return[];}}
function saveHistory(a){const before=loadHistory();localStorage.setItem(STORE_HISTORY, JSON.stringify(a));QuizSync.captureHistory(before,a);}
function loadFavs(){try{return JSON.parse(localStorage.getItem(STORE_FAVS)||'{}');}catch{return{};}}
function saveFavs(o){const before=loadFavs();localStorage.setItem(STORE_FAVS, JSON.stringify(o));QuizSync.captureFavorites(before,o);}
function loadOverrides(){try{return JSON.parse(localStorage.getItem(STORE_OVERRIDES)||'{}');}catch{return{};}}
function saveOverrides(o){const before=loadOverrides();localStorage.setItem(STORE_OVERRIDES, JSON.stringify(o));QuizSync.captureOverrides(before,o);}
function loadSessions(){try{return JSON.parse(localStorage.getItem(STORE_SESSIONS)||'{}');}catch{return{};}}
function saveSessions(o){const before=loadSessions();localStorage.setItem(STORE_SESSIONS, JSON.stringify(o));QuizSync.captureSessions(before,o);}
function getSession(pid){return loadSessions()[pid]||null;}
function setSession(pid, s){const all=loadSessions(); all[pid]=s; saveSessions(all);}
function clearSessionFor(pid){const all=loadSessions(); delete all[pid]; saveSessions(all);}

// Apply user-defined category overrides on top of the loaded papers
function applyOverrides(){
  const ov = loadOverrides();
  for (const p of state.papers){
    if (ov[p.id] && ov[p.id].category){
      p.category = ov[p.id].category;
    }
  }
}

// =========== Routing ===========
function go(tab){
  // hide quiz mode first
  document.body.classList.remove('quiz-mode');
  if (tab === 'home') {
    state.homeView = 'categories';
    state.activeCategory = null;
  }
  ['home','favs','wrong','stats','data','quiz'].forEach(t=>{
    const sec = $('page-'+t); if (sec) sec.classList.add('hidden');
  });
  $('qbar').classList.add('hidden');
  // mark active on both navs
  const navTab = tab === 'favs' ? 'wrong' : tab;
  document.querySelectorAll('.tabbar .tab, .sidebar nav button').forEach(b=>{
    b.classList.toggle('on', b.dataset.tab === navTab);
  });
  $('page-'+tab).classList.remove('hidden');
  if (tab === 'home')  renderHome();
  if (tab === 'favs')  renderFavs();
  if (tab === 'wrong') renderWrong();
  if (tab === 'stats') renderStats();
  window.scrollTo({top:0,behavior:'instant'});
}

// =========== Sidebar ===========
function toggleSidebar(){
  const sb = $('sidebar');
  sb.classList.toggle('collapsed');
  localStorage.setItem(STORE_SIDEBAR, sb.classList.contains('collapsed') ? '1' : '0');
}
function initSidebar(){
  if (localStorage.getItem(STORE_SIDEBAR) === '1'){
    $('sidebar').classList.add('collapsed');
  }
}

// =========== Init ===========
async function init(){
  initSidebar();
  try{
    const res = await fetch('data/index.json', {cache:'no-cache'});
    const idx = await res.json();
    state.papers = idx.papers || [];
    applyOverrides();
  }catch(e){
    state.papers = []; toast('题库索引加载失败');
  }
  await QuizSync.init({
    onRemoteApplied: ()=>{
      applyOverrides();
      if (state.current) return;
      if (!$('page-home').classList.contains('hidden')) renderHome();
      if (!$('page-stats').classList.contains('hidden')) renderStats();
      if (!$('page-favs').classList.contains('hidden')) renderFavs();
      if (!$('page-wrong').classList.contains('hidden')) renderWrong();
    },
  });
  go('home');
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}

// =========== Home ===========
function renderHome(){
  const root = $('homeContent'); root.innerHTML = '';
  const title = $('homeTitle');
  const profileBtn = $('homeProfileBtn');
  if (!state.papers.length){
    title.textContent = '练习';
    profileBtn.classList.remove('hidden');
    root.innerHTML = '<div class="empty">还没有题册。请向项目仓库追加题册数据。</div>';
    return;
  }
  if (state.homeView === 'categories'){
    title.textContent = '练习';
    profileBtn.classList.remove('hidden');
    renderDashboard(root);
  } else {
    title.textContent = state.activeCategory || '题库';
    profileBtn.classList.add('hidden');
    renderPaperList(root, state.activeCategory);
  }
}
function renderDashboard(root){
  const groups = {};
  for (const def of HOME_CATEGORY_DEFS) groups[def.name] = [];
  for (const p of state.papers){
    const homeCat = homeCategoryFor(p.category);
    (groups[homeCat] = groups[homeCat] || []).push(p);
  }
  const hist = loadHistory();
  const sessions = loadSessions();
  const activeSessions = Object.entries(sessions)
    .map(([pid,sess])=>({paper:state.papers.find(p=>p.id===pid),sess}))
    .filter(x=>x.paper && x.sess && Object.keys(x.sess.selected||{}).length)
    .sort((a,b)=>(b.sess.savedAt||0)-(a.sess.savedAt||0));
  const latestHist = hist.slice().sort((a,b)=>b.finishedAt-a.finishedAt);
  const recent = [];
  const addRecent = (paper, rec=null, sess=null)=>{
    if (paper && !recent.some(x=>x.paper.id===paper.id) && recent.length<3) recent.push({paper,rec,sess});
  };
  for (const x of activeSessions) addRecent(x.paper, latestHist.find(h=>h.paperId===x.paper.id)||null, x.sess);
  for (const h of latestHist) addRecent(state.papers.find(p=>p.id===h.paperId), h, sessions[h.paperId]||null);
  for (const p of state.papers) addRecent(p, null, sessions[p.id]||null);

  const focus = activeSessions[0] || {paper:(recent[0]&&recent[0].paper)||state.papers[0],sess:null};
  if (focus.paper){
    const answered = focus.sess ? Object.keys(focus.sess.selected||{}).length : 0;
    const pct = Math.min(100, Math.round(answered/focus.paper.count*100));
    const elapsedSec = focus.sess ? Math.floor((focus.sess.elapsedMs||0)/1000) : 0;
    const hero = document.createElement('div'); hero.className='home-hero';
    const heroAction = focus.sess
      ? `startQuiz('${focus.paper.id}',{resume:true})`
      : `openPaper('${focus.paper.id}')`;
    hero.innerHTML = `
      <div class="hero-top">
        <div class="eyebrow">${focus.sess?'继续上次练习':'开始一套练习'}</div>
        <div class="hero-title">${escapeHtml(focus.paper.title)}</div>
        <div class="hero-status-line"><span class="status">${focus.sess?'进行中':'待开始'}</span></div>
      </div>
      <div class="hero-progress-line"><div class="hero-progress"><span style="width:${pct}%"></span></div><span class="hero-progress-value">${pct}%</span></div>
      <div class="hero-meta"><span>已答 ${answered} / ${focus.paper.count}</span><i class="sep"></i><span>用时 ${mmss(elapsedSec)}</span></div>
      <button class="hero-btn" onclick="${heroAction}">${focus.sess?'继续练习':'开始练习'}</button>`;
    root.appendChild(hero);
  }

  const catHead = document.createElement('div'); catHead.className='section-head';
  catHead.innerHTML = `<h2>题库分类</h2><button type="button" onclick="showAllPapers()">全部&nbsp; ›</button>`;
  root.appendChild(catHead);
  const grid = document.createElement('div'); grid.className='category-grid';
  for (const cat of Object.keys(groups)){
    const ps = groups[cat];
    const item = document.createElement('button'); item.className='category-item'; item.type='button';
    item.innerHTML = `<span class="cat-icon">${categoryIcon(cat)}</span><span class="cat-name">${escapeHtml(cat)}</span>`;
    item.onclick=()=>ps.length ? enterCategory(cat) : toast('该分类还没有题册');
    grid.appendChild(item);
  }
  root.appendChild(grid);

  const recentHead = document.createElement('div'); recentHead.className='section-head';
  recentHead.innerHTML = `<h2>最近练习</h2>`;
  root.appendChild(recentHead);
  const list = document.createElement('div'); list.className='group-list';
  for (const {paper,rec,sess} of recent){
    const row=document.createElement('div'); row.className='group-row';
    const savedCount = sess ? Object.keys(sess.selected||{}).length : 0;
    const recAnswered = rec ? (rec.answeredCount != null ? rec.answeredCount : Object.keys(rec.answers||{}).length) : 0;
    const recCompletion = rec ? Math.round(recAnswered/rec.total*1000)/10 : 0;
    const meta = savedCount
      ? `进行中 · 已答 ${savedCount}/${paper.count} · 用时 ${mmss(Math.floor((sess.elapsedMs||0)/1000))}`
      : rec ? (isPracticeRecord(rec)
        ? `上次完成 ${recCompletion}% · 用时 ${fmtDuration(rec.durationSec)}`
        : `上次 ${Math.round(rec.accuracy*100)}% · 用时 ${fmtDuration(rec.durationSec)}`)
      : `尚未练习 · ${paper.count} 题`;
    row.innerHTML=`<div class="row-body"><div class="row-title">${escapeHtml(paper.title)}</div><div class="row-meta">${meta}</div></div><span class="row-chev">›</span>`;
    row.onclick=()=>openPaper(paper.id);
    list.appendChild(row);
  }
  root.appendChild(list);
}
function renderPaperList(root, cat){
  const crumb = document.createElement('div'); crumb.className = 'crumb';
  crumb.innerHTML = `<button onclick="backToCategories()">‹ 返回题库</button>`;
  root.appendChild(crumb);

  const ps = cat === '全部题库' ? state.papers : state.papers.filter(p=>homeCategoryFor(p.category)===cat);
  const hist = loadHistory();
  const byPaper = {};
  for (const h of hist){
    (byPaper[h.paperId] = byPaper[h.paperId] || []).push(h);
  }
  const label = document.createElement('div'); label.className = 'sec-label';
  label.textContent = ps.length + ' 套试卷';
  root.appendChild(label);
  const cards = document.createElement('div'); cards.className = 'paper-list';
  for (const p of ps){
    const recs = byPaper[p.id] || [];
    const att = recs.length;
    const scoredRecs = recs.filter(r=>!isPracticeRecord(r));
    const best = scoredRecs.length ? Math.max(...scoredRecs.map(r=>r.accuracy)) : null;
    const last = att ? recs.slice().sort((a,b)=>b.finishedAt-a.finishedAt)[0] : null;
    const sess = getSession(p.id);
    const card = document.createElement('div'); card.className = 'paper-card';
    const resumeBadge = (sess && Object.keys(sess.selected||{}).length>0)
      ? `<div class="p-resume">上次第 ${(sess.currentQ||0)+1} 题 · 已答 ${Object.keys(sess.selected).length}/${p.count} · ${fmtDuration(Math.floor((sess.elapsedMs||0)/1000))}</div>`
      : '';
    const lastAnswered = last ? (last.answeredCount != null ? last.answeredCount : Object.keys(last.answers||{}).length) : 0;
    const lastCompletion = last ? Math.round(lastAnswered/last.total*1000)/10 : 0;
    const statHtml = !att
      ? `<span class="p-stat">尚未练习</span>`
      : isPracticeRecord(last)
        ? `<span class="p-stat">上次完成 ${lastCompletion}% · 已答 ${lastAnswered}/${last.total} · 用时 ${fmtDuration(last.durationSec)}</span>`
        : `<span class="p-stat">上次 ${Math.round(last.accuracy*100)}% · 用时 ${fmtDuration(last.durationSec)} · 最高 ${Math.round(best*100)}%</span>`;
    card.innerHTML = `
      <div class="p-top">
        <div class="p-title">${escapeHtml(p.title)}</div>
        <div class="p-count">${p.count} 题</div>
        <button class="menu-btn" title="更多">⋯</button>
      </div>
      <div class="p-stats">${statHtml}</div>
      ${resumeBadge}`;
    card.querySelector('.menu-btn').addEventListener('click', (e)=>{
      e.stopPropagation();
      openPaperMenu(p);
    });
    card.onclick = ()=>openPaper(p.id);
    cards.appendChild(card);
  }
  root.appendChild(cards);
}

// Click a paper card → if there's a saved session, ask to resume; otherwise start fresh
function openPaper(pid){
  const sess = getSession(pid);
  if (sess && Object.keys(sess.selected||{}).length>0){
    const ans = Object.keys(sess.selected).length;
    const mins = Math.floor((sess.elapsedMs||0)/60000);
    const ok = confirm(`检测到上次进度：第 ${(sess.currentQ||0)+1} 题，已答 ${ans} 题，用时约 ${mins} 分钟。\n\n点【确定】继续，点【取消】重新开始。`);
    if (ok) return startQuiz(pid, { resume:true });
    clearSessionFor(pid);
  }
  startQuiz(pid);
}
function enterCategory(cat){ state.homeView='papers'; state.activeCategory=cat; renderHome(); window.scrollTo({top:0,behavior:'instant'}); }
function showAllPapers(){ state.homeView='papers'; state.activeCategory='全部题库'; renderHome(); window.scrollTo({top:0,behavior:'instant'}); }
function backToCategories(){ state.homeView='categories'; state.activeCategory=null; renderHome(); window.scrollTo({top:0,behavior:'instant'}); }

// =========== Paper menu (⋯) ===========
function openMenu(title, items){
  $('menuTtl').textContent = title;
  const root = $('menuItems'); root.innerHTML = '';
  for (const it of items){
    const b = document.createElement('button');
    b.className = 'menu-item' + (it.danger?' danger':'');
    b.innerHTML = it.label + (it.sub?`<span class="sub">${escapeHtml(it.sub)}</span>`:'');
    b.addEventListener('click', ()=>{ closeMenu(); setTimeout(it.onClick, 50); });
    root.appendChild(b);
  }
  $('menuSheet').classList.add('show');
  $('menuBd').classList.add('show');
}
function closeMenu(){
  $('menuSheet').classList.remove('show');
  $('menuBd').classList.remove('show');
}
function openPaperMenu(p){
  const sess = getSession(p.id);
  const hist = loadHistory().filter(h=>h.paperId===p.id);
  const items = [];
  items.push({ label:'更改分类', sub:'当前：'+p.category, onClick:()=>promptCategoryChange(p) });
  if (hist.length || sess){
    items.push({ label:`清空本套记录 (${hist.length} 条历史${sess?' + 进行中进度':''})`, danger:true, onClick:()=>clearPaperData(p) });
  }
  items.push({ label:'取消', onClick:()=>{} });
  openMenu(p.title, items);
}

function promptCategoryChange(p){
  // build options: existing distinct categories + 新建分类
  const existing = [...new Set(state.papers.map(x=>x.category))];
  const items = existing.map(c=>({
    label: c + (c===p.category?'  ✓':''),
    onClick: ()=>setPaperCategory(p, c),
  }));
  items.push({ label:'＋ 新建分类…', onClick:()=>{
    const name = (prompt('新分类名称（例如：言语理解 / 资料分析 / 套题训练 / 课程试卷）','')||'').trim();
    if (name) setPaperCategory(p, name);
  }});
  items.push({ label:'取消', onClick:()=>{} });
  openMenu('为《'+p.title+'》选择分类', items);
}

function setPaperCategory(p, newCat){
  if (!newCat || newCat === p.category){ return; }
  // persist override
  const ov = loadOverrides();
  ov[p.id] = ov[p.id] || {};
  ov[p.id].category = newCat;
  saveOverrides(ov);
  p.category = newCat;
  // update all history rows for this paper to keep stats consistent
  const hist = loadHistory();
  let changed = 0;
  for (const h of hist){ if (h.paperId === p.id && h.category !== newCat){ h.category = newCat; changed++; } }
  if (changed) saveHistory(hist);
  toast('已分类到「'+newCat+'」');
  // re-render: if we were inside the old category and it's now empty, back out
  if (state.homeView === 'papers'){
    const stillHas = state.papers.some(x=>x.category===state.activeCategory);
    if (!stillHas) backToCategories();
    else if (state.activeCategory !== newCat){ renderHome(); }
    else renderHome();
  } else { renderHome(); }
}

function clearPaperData(p){
  if (!confirm(`确定清空《${p.title}》的所有做题记录和进行中的进度？\n此操作不可撤销。`)) return;
  const next = loadHistory().filter(h=>h.paperId !== p.id);
  saveHistory(next);
  clearSessionFor(p.id);
  toast('已清空');
  renderHome();
}

// =========== Quiz ===========
async function loadPaper(id){
  if (state.paperData[id]) return state.paperData[id];
  const p = state.papers.find(x=>x.id===id);
  if (!p) throw new Error('paper not found');
  const res = await fetch(p.file, {cache:'no-cache'});
  const data = await res.json();
  state.paperData[id] = data;
  return data;
}

async function startQuiz(id, opts){
  // opts: { resume?:bool, jumpToQNum?:int }
  opts = opts || {};
  // backward-compat: previous signature was startQuiz(id, qNum)
  if (typeof opts === 'number') opts = { jumpToQNum: opts };
  const data = await loadPaper(id);
  state.current = data;
  state.currentQ = 0;
  state.selected = {};
  state.graded = false;
  state.startedAt = Date.now();
  state.reportReturn = null;
  state.reportRecord = null;
  document.body.classList.remove('score-mode');
  // resume from saved session
  if (opts.resume){
    const sess = getSession(id);
    if (sess){
      state.selected = sess.selected || {};
      state.currentQ = sess.currentQ || 0;
      state.startedAt = Date.now() - (sess.elapsedMs || 0);
    }
  } else {
    // fresh start clears any stale session for this paper
    clearSessionFor(id);
  }
  // hide non-quiz sections
  ['home','favs','wrong','stats','data'].forEach(t=>$('page-'+t).classList.add('hidden'));
  $('page-quiz').classList.remove('hidden');
  $('qbar').classList.remove('hidden');
  $('submitBtn').style.display = '';
  $('submitBtn').textContent = isGradablePaper(data) ? '交卷' : '提交';
  document.querySelectorAll('.graded-only').forEach(el=>el.classList.toggle('hidden', !isGradablePaper(data)));
  document.body.classList.add('quiz-mode');
  // header (no category text)
  $('quizTitle').textContent = data.title;
  $('quizMeta').textContent  = '共 ' + data.questions.length + ' 题';
  // timer
  startTimer();
  // reset next handler in case scorecard reassigned it
  $('nextBtn').onclick = nextOrSubmit;
  // jump after restoration
  if (opts.jumpToQNum != null){
    const idx = data.questions.findIndex(q=>q.num===opts.jumpToQNum);
    if (idx>=0) state.currentQ = idx;
  }
  renderCurrentQ();
}

function startTimer(){
  clearInterval(state.timerId);
  state.timerId = setInterval(()=>{
    const sec = Math.floor((Date.now()-state.startedAt)/1000);
    $('quizTimer').textContent = mmss(sec);
  }, 500);
  $('quizTimer').textContent = '00:00';
}
function stopTimer(){ clearInterval(state.timerId); state.timerId=0; }

function renderCurrentQ(){
  const data = state.current;
  const gradable = isGradablePaper(data);
  const i = state.currentQ;
  const item = data.questions[i];
  const total = data.questions.length;
  // progress
  const done = Object.keys(state.selected).length;
  $('qprogFill').style.width = (state.graded ? 100 : (i+1)/total*100) + '%';
  // meta
  $('qMetaLeft').textContent = `第 ${item.num} 题 / 共 ${total} 题`;
  $('qMetaRight').textContent = state.graded ? (gradable ? '已判分' : '已提交') : `已答 ${done}/${total}`;
  // body
  const body = $('qBody');
  body.innerHTML = `
    <div class="q-stem-card" id="qCard">
      <div class="stem">${escapeHtml(item.stem)}</div>
      ${item.image ? `<img class="q-figure" src="${escapeHtml(item.image)}" alt="题目附图">` : ''}
    </div>
    <div class="opts ${state.graded ? 'graded' : ''}" id="optsBox">
      ${['A','B','C','D'].map(L=>{
        const ans = state.selected[item.num];
        // Answered papers use correctness colors; free-practice papers use a neutral selected state.
        let cls = '';
        if (ans && L === ans) cls = gradable ? (ans === item.answer ? 'correct' : 'wrong') : 'sel';
        return `<div class="opt ${cls}" data-key="${L}"><div class="tag">${L}</div><div class="txt">${escapeHtml(item.options[L]||'')}</div></div>`;
      }).join('')}
    </div>
  `;
  if (!state.graded){
    body.querySelectorAll('.opt').forEach(o=>o.addEventListener('click', onOptClick));
  }
  // favorite state
  updateFavBtn();
  // next button label
  const last = i === total-1;
  $('nextBtn').textContent = state.graded
    ? (last ? (gradable ? '查看成绩' : '查看记录') : '下一题')
    : (last ? (gradable ? '提交并判分' : '提交练习') : '下一题');
  $('nextBtn').classList.toggle('submit', !state.graded && last);
  // prev disabled state
  $('prevBtn').classList.toggle('disabled', i===0);
  // right-pane grid (iPad) + sheet grid both refresh
  renderAnswerGrids();
}

function onOptClick(e){
  if (state.graded) return;
  const qIdx = state.currentQ;
  const item = state.current.questions[qIdx];
  const gradable = isGradablePaper(state.current);
  if (!item) return;

  const el = e.currentTarget;
  const L = el.dataset.key;
  if (!L) return;

  const wasAnswered = state.selected[item.num] != null;
  state.selected[item.num] = L;
  persistActiveSession();

  // Update option colors in-place (clear all, highlight only selected)
  const optsBox = document.getElementById('optsBox');
  if (optsBox) {
    const correctAnswer = String(item.answer || '').trim();
    optsBox.querySelectorAll('.opt').forEach(o => {
      const oL = o.dataset.key;
      o.classList.remove('correct', 'wrong', 'sel');
      if (oL === L) {
        o.classList.add(gradable ? (oL === correctAnswer ? 'correct' : 'wrong') : 'sel');
      }
    });
  }

  // Update meta count
  const done = Object.keys(state.selected).length;
  const total = state.current.questions.length;
  $('qMetaRight').textContent = `已答 ${done}/${total}`;

  // Update next button label on last question
  const last = qIdx === total - 1;
  if (last) {
    $('nextBtn').textContent = gradable ? '提交并判分' : '提交练习';
    $('nextBtn').classList.add('submit');
  }

  renderAnswerGrids();

  // Free practice always advances after a choice; scored papers keep change-in-place behavior.
  if (!last && (!gradable || !wasAnswered)) {
    setTimeout(() => {
      if (!state.graded && state.currentQ === qIdx) nextOrSubmit();
    }, gradable ? 850 : 260);
  }
}

function prevQ(){
  if (state.currentQ === 0) return;
  state.currentQ--;
  persistActiveSession();
  renderCurrentQ();
  window.scrollTo({top:0,behavior:'instant'});
}
function nextOrSubmit(){
  const last = state.currentQ === state.current.questions.length - 1;
  if (state.graded){
    if (!last){ state.currentQ++; renderCurrentQ(); window.scrollTo({top:0,behavior:'instant'}); }
    else { showScorecard(); }
    return;
  }
  if (last){ submitGrade(); return; }
  state.currentQ++; renderCurrentQ();
  persistActiveSession();
  window.scrollTo({top:0,behavior:'instant'});
}
function jumpQ(idx){
  state.currentQ = idx;
  persistActiveSession();
  renderCurrentQ();
  closeSheet();
  window.scrollTo({top:0,behavior:'instant'});
}

function submitGrade(){
  const data = state.current;
  const gradable = isGradablePaper(data);
  const unanswered = data.questions.length - Object.keys(state.selected).length;
  if (unanswered > 0 && !state.graded){
    if (!confirm(`还有 ${unanswered} 题未作答，确定提交？`)){ closeSheet(); return; }
  }
  state.graded = true;
  stopTimer();
  $('submitBtn').style.display = 'none';
  // compute
  let correct = 0;
  for (const item of data.questions){
    if (state.selected[item.num] === item.answer) correct++;
  }
  const total = data.questions.length;
  const acc = gradable ? correct/total : null;
  const answeredCount = Object.keys(state.selected).length;
  const dur = Math.round((Date.now()-state.startedAt)/1000);
  const rec = {
    sessionId: uuid(),
    paperId: data.id,
    paperTitle: data.title,
    category: data.category,
    startedAt: state.startedAt,
    finishedAt: Date.now(),
    durationSec: dur,
    answers: {...state.selected},
    answeredCount,
    grading: gradable ? 'scored' : 'none',
    correctCount: gradable ? correct : null,
    total, accuracy: acc,
  };
  const hist = loadHistory(); hist.push(rec); saveHistory(hist);
  clearSessionFor(data.id);  // submitted → drop in-progress
  closeSheet();
  toast(gradable ? `已提交 · 正确率 ${Math.round(acc*100)}%` : `已提交 · 完成 ${answeredCount}/${total}`);
  showScorecard(rec);
}

function showPracticeReport(precomputed){
  const data = state.current;
  const reportRec = precomputed || state.reportRecord;
  if (precomputed) state.reportRecord = precomputed;
  const total = data.questions.length;
  const answered = Object.keys(state.selected).length;
  const unanswered = Math.max(0, total-answered);
  const completion = total ? Math.round(answered/total*1000)/10 : 0;
  const dur = Math.round(((reportRec && reportRec.durationSec) || (Date.now()-state.startedAt)/1000));
  const finishedAt = (reportRec && reportRec.finishedAt) || Date.now();
  const returnLabel = state.reportReturn === 'stats' ? '返回记录' : '返回题库';
  const answerGrid = data.questions.map((q,idx)=>{
    const cls = state.selected[q.num] ? 'answered' : 'unanswered';
    return `<button class="${cls}" onclick="reviewQuestion(${idx})" title="查看第 ${q.num} 题">${q.num}</button>`;
  }).join('');
  $('qBody').innerHTML = `
    <div class="report-page">
      <section class="report-card report-summary">
        <div class="report-score-pill">完成度 ${completion}%</div>
        <div class="report-ring" style="--score:${Math.round(completion*3.6)}deg"><div class="report-ring-core"><span>已答</span><b>${answered}</b><em>/ ${total}</em></div></div>
        <div class="report-meta">
          <div class="report-meta-row"><span>练习类型</span><strong>自由练习（不判分）</strong></div>
          <div class="report-meta-row"><span>提交时间</span><strong>${fmtDate(finishedAt)}</strong></div>
        </div>
      </section>

      <section class="report-card">
        <div class="report-card-title"><span class="report-title-icon"><svg class="ui-icon"><path d="M5 12.5 9.2 17 19 7"/></svg></span>练习情况</div>
        <div class="report-metrics practice">
          <div class="report-metric"><span>共</span><b>${total}</b></div>
          <div class="report-metric"><span>已答</span><b>${answered}</b></div>
          <div class="report-metric"><span>未答</span><b>${unanswered}</b></div>
          <div class="report-metric time"><span>用时</span><b>${fmtDuration(dur)}</b></div>
        </div>
        <div class="report-category"><span class="dot">⌄</span><div><strong>${escapeHtml(homeCategoryFor(data.category))}</strong><p>共 ${total} 题，已答 ${answered} 题，完成度 ${completion}%，用时 ${fmtDuration(dur)}</p></div></div>
      </section>

      <section class="report-card">
        <div class="report-card-head"><div class="report-card-title"><span class="report-title-icon"><svg class="ui-icon"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h.01m4 0h.01m4 0h.01M8 15h.01m4 0h.01m4 0h.01"/></svg></span>答题卡</div><div class="report-legend"><span><i style="background:#edf0f4"></i>未答</span><span><i style="background:var(--primary)"></i>已答</span></div></div>
        <div class="report-answer-grid">${answerGrid}</div>
      </section>

      <div class="report-actions">
        <button class="btn" onclick="reviewQuestion(0)">查看全部题目</button>
        <button class="btn primary" onclick="quitQuiz()">${returnLabel}</button>
        <button class="btn wide" onclick="restartQuiz()">再做一遍</button>
      </div>
    </div>
  `;
  document.body.classList.add('score-mode');
  $('quizTitle').textContent = '练习记录';
  $('quizMeta').textContent = data.title;
  $('qbar').classList.add('hidden');
  $('qprogFill').style.width = '100%';
  $('qMetaLeft').textContent = '本次练习';
  $('qMetaRight').textContent = '';
  $('nextBtn').textContent = '查看题目';
  $('nextBtn').classList.remove('submit');
  $('nextBtn').onclick = ()=>{ state.currentQ = 0; renderCurrentQ(); window.scrollTo({top:0,behavior:'instant'}); };
}

function showScorecard(precomputed){
  const data = state.current;
  if (!isGradablePaper(data)){
    showPracticeReport(precomputed);
    return;
  }
  const reportRec = precomputed || state.reportRecord;
  if (precomputed) state.reportRecord = precomputed;
  let correct = 0;
  for (const item of data.questions){
    if (state.selected[item.num] === item.answer) correct++;
  }
  const total = data.questions.length;
  const acc = correct/total;
  const dur = Math.round(((reportRec && reportRec.durationSec) || (Date.now()-state.startedAt)/1000));
  const answered = Object.keys(state.selected).length;
  const wrong = Math.max(0, answered-correct);
  const unanswered = Math.max(0, total-answered);
  const previous = loadHistory()
    .filter(h=>h.paperId===data.id && (!reportRec || h.sessionId!==reportRec.sessionId))
    .sort((a,b)=>b.finishedAt-a.finishedAt)[0];
  const delta = previous ? Math.round((acc-previous.accuracy)*100) : null;
  const deltaHtml = delta === null ? '' : `<div class="report-delta">${delta>0?'较上次提高 '+delta+'%':delta<0?'较上次下降 '+Math.abs(delta)+'%':'与上次持平'}</div>`;
  const reviewCount = wrong + unanswered;
  const finishedAt = (reportRec && reportRec.finishedAt) || Date.now();
  const returnLabel = state.reportReturn === 'stats' ? '返回记录' : '返回题库';

function reviewQuestion(idx){
  const data = state.current;
  document.body.classList.remove('score-mode');
  $('qbar').classList.remove('hidden');
  $('quizTitle').textContent = data.title;
  $('quizMeta').textContent = '共 ' + data.questions.length + ' 题';
  state.currentQ = Math.max(0, Math.min(idx, data.questions.length-1));
  renderCurrentQ();
  $('nextBtn').onclick = nextOrSubmit;
  window.scrollTo({top:0,behavior:'instant'});
}

function reviewWrong(){
  const data = state.current;
  const firstWrong = data.questions.findIndex(q=>state.selected[q.num] !== q.answer);
  if (firstWrong === -1){ toast('全对，没有错题'); return; }
  reviewQuestion(firstWrong);
}

function restartQuiz(){
  const id = state.current.id;
  clearSessionFor(id);
  startQuiz(id);
}

function persistActiveSession(){
  if (!state.current || state.graded || Object.keys(state.selected).length===0) return;
  setSession(state.current.id, {
    selected: {...state.selected},
    currentQ: state.currentQ,
    elapsedMs: Date.now() - state.startedAt,
    savedAt: Date.now(),
  });
}

function quitQuiz(){
  const returnTab = state.reportReturn || 'home';
  // Auto-save in-progress session (timer pauses, can resume next time)
  if (state.current && !state.graded && Object.keys(state.selected).length>0){
    persistActiveSession();
    toast('进度已暂存，下次可继续');
  }
  stopTimer();
  document.body.classList.remove('score-mode');
  state.current = null;
  state.reportReturn = null;
  state.reportRecord = null;
  $('nextBtn').onclick = nextOrSubmit;
  go(returnTab);
}

function quizBack(){
  if (state.graded && state.reportRecord && !document.body.classList.contains('score-mode')){
    showScorecard();
    window.scrollTo({top:0,behavior:'instant'});
    return;
  }
  quitQuiz();
}

// =========== Answer card grids ===========
function renderAnswerGrids(){
  if (!state.current) return;
  const gradable = isGradablePaper(state.current);
  const html = [];
  state.current.questions.forEach((q, idx)=>{
    let cls = 'acell';
    if (state.graded && gradable){
      if (state.selected[q.num] === q.answer) cls += ' correct';
      else if (state.selected[q.num]) cls += ' wrong';
      else cls += ' wrong'; // unanswered also marked wrong
    } else if (state.selected[q.num]){ cls += ' answered'; }
    if (idx === state.currentQ) cls += ' cur';
    html.push(`<div class="${cls}" onclick="jumpQ(${idx})">${q.num}</div>`);
  });
  const joined = html.join('');
  $('rightGrid').innerHTML = joined;
  $('sheetGrid').innerHTML = joined;
  document.querySelectorAll('.graded-only').forEach(el=>el.classList.toggle('hidden', !gradable));
  // Submit btn states
  const submitDisabled = state.graded;
  $('rightSubmit').textContent = submitDisabled ? (gradable ? '已判分' : '已提交') : (gradable ? '提交并判分' : '提交练习');
  $('rightSubmit').disabled = submitDisabled;
  $('sheetSubmit').textContent = submitDisabled ? (gradable ? '已判分' : '已提交') : (gradable ? '提交并判分' : '提交练习');
  $('sheetSubmit').disabled = submitDisabled;
  $('sheetSub').textContent = `${state.currentQ+1} / ${state.current.questions.length}`;
}

function isFav(paperId, qNum){

}
function toggleFav(){
  if (!state.current) return;
  const qNum = state.current.questions[state.currentQ].num;
  const f = loadFavs();
  f[state.current.id] = f[state.current.id] || [];
  const list = f[state.current.id];
  const i = list.indexOf(qNum);
  if (i>=0){ list.splice(i,1); toast('已取消收藏'); }
  else { list.push(qNum); toast('已收藏'); }
